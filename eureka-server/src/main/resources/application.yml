server:
  port: 8761

spring:
  application:
    name: eureka-server
  security:
    user:
      name: eureka
      password: eureka123

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false   # solo para el ambiente de demostracion

management:
  endpoints:
    web:
      exposure:
        include: health,info
